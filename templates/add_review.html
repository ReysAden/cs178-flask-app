<!doctype html>
<html lang="en">
<head><title>Add Review</title></head>
<body>
  <h1>Add Product Review</h1>
  <form action="{{ url_for('add_review_route') }}" method="post">
    <label>Item Description:</label><br>
    <input type="text" name="itemDescription" required><br>
    <label>Your Name:</label><br>
    <input type="text" name="reviewerName" required><br>
    <label>Rating (1-5):</label><br>
    <input type="number" name="rating" min="1" max="5" required><br>
    <label>Comment:</label><br>
    <input type="text" name="comment" required><br>
    <input type="submit" value="Submit Review">
  </form>
</body>
</html>
